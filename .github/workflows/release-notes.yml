name: Release notes

# Homebridge UI shows the description of the GitHub release as the release notes
# when a plugin is updated. This workflow fills that description with the
# matching CHANGELOG.md section as soon as a release is published, so the notes
# are written once, in the changelog.
#
# A description written by hand is left alone. To fill a release that already
# exists, or to create one for a tag that has none, start this workflow from the
# Actions tab and give it the tag, for example v1.0.19. GitHub marks a new
# release as the latest one, so "latest" stays unchecked unless the tag is the
# newest version: an older version can then be added without taking the label
# from the newest one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to fill, for example v1.0.19
        required: true
        type: string
      latest:
        description: Mark the release as the latest one (only for the newest version)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  notes:
    name: Fill the release notes
    # A release that is not tagged like a version is not a plugin release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      LATEST: ${{ inputs.latest || false }}
    steps:
      # A release event checks out its tag, so the changelog is the one the
      # release was made from. A manual run checks out the default branch.
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract the notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "${TAG#v}" > "${RUNNER_TEMP}/notes.md"

      - name: Write the notes to the release
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            body="$(gh release view "${TAG}" --json body --jq .body)"
            if [ -n "${body//[[:space:]]/}" ]; then
              echo "Release ${TAG} already has a description, leaving it as it is."
            else
              gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
              echo "Filled the description of release ${TAG} from CHANGELOG.md."
            fi
            if [ "${LATEST}" = "true" ]; then
              gh release edit "${TAG}" --latest
              echo "Marked release ${TAG} as the latest one."
            fi
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --latest="${LATEST}" --notes-file "${RUNNER_TEMP}/notes.md"
            echo "Created release ${TAG} with the notes from CHANGELOG.md."
          fi
